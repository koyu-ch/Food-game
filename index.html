<html lang="zh-Hant">
<head>

<title>今天吃什麼？阿吃導遊</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1d1b2e;--mute:#656a80;--line:#d5d9e6;--g1:#ffd0a1;--g2:#ff8e5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121420;--card:#1c1f30;--ink:#eceaf7;--mute:#a0a4bb;--line:#33374f}}
:root[data-theme="dark"]{--bg:#121420;--card:#1c1f30;--ink:#eceaf7;--mute:#a0a4bb;--line:#33374f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,#g:focus-visible{outline:3px solid #7c5cbf;outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:14px 12px 28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:20px;margin:0;font-weight:900}
.top small{color:var(--mute);font-weight:500;margin-left:6px}
.gear{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700}
.stage{display:grid;grid-template-columns:minmax(104px,36%) 1fr;gap:10px;min-height:460px;border-radius:28px;padding:16px 12px;background:linear-gradient(165deg,var(--g1),var(--g2));transition:background .6s}
.gcol{position:relative;display:flex;align-items:flex-end}
#g{display:block;width:100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28));cursor:pointer;animation:bob 2.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
#g.hop{animation:hop .6s ease}
@keyframes bob{50%{transform:translateY(4px)}}
@keyframes hop{30%{transform:translateY(-20px) rotate(-4deg)}60%{transform:none}70%{transform:rotate(3deg)}100%{transform:none}}
#armR{transform-origin:80px 128px;transition:transform .35s}
.point{transform:rotate(-80deg)}.up{transform:rotate(-165deg)}
.wave{animation:wave .6s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-135deg)}to{transform:rotate(-170deg)}}
#pop{position:absolute;top:4px;left:0;background:#fff;color:#1d1b2e;border-radius:12px;padding:4px 9px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
#pop.on{opacity:1}
.talk{display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
#bub{position:relative;background:#fff;color:#1d1b2e;border-radius:18px;padding:12px 14px;min-height:5.2em;font-size:15px;font-weight:600;white-space:pre-line}
#bub::before{content:"";position:absolute;top:22px;left:-9px;border:10px solid transparent;border-left:0;border-right-color:#fff}
#choices{display:flex;flex-direction:column;gap:8px}
.ch{background:#fff;color:#1d1b2e;border:2px solid #1d1b2e;border-radius:14px;padding:10px 12px;font-weight:700;text-align:left;cursor:pointer;transition:transform .12s}
.ch:active{transform:scale(.97);background:#1d1b2e;color:#fff}
.res{background:#fff;color:#1d1b2e;border-radius:18px;padding:12px 14px}
.res .lab{font-size:12px;color:#656a80;font-weight:700}
.res .nm{font-size:22px;font-weight:900;line-height:1.3;margin:2px 0 4px}
.chip{display:inline-block;border:1.5px solid #1d1b2e;border-radius:999px;padding:0 10px;font-size:12px;font-weight:700}
.row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1 1 80px;border:2px solid #1d1b2e;background:#fff;color:#1d1b2e;border-radius:12px;padding:8px 6px;font-weight:800;cursor:pointer}
.btn.p{background:#1d1b2e;color:#fff}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.6}
.fi{flex:1 1 100px;min-width:0;border:2px solid #1d1b2e;border-radius:12px;padding:8px 10px;background:#fff;color:#1d1b2e}
#panel{position:fixed;inset:0;background:rgba(10,10,25,.6);display:none;z-index:9;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#panel.on{display:block}
.sheet{background:var(--card);max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:14px}
.sheet h2{margin:0;font-size:18px}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.add input,.add select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.add .btn{grid-column:1/3;background:#1d1b2e;color:#fff}
#list{overflow-y:auto;flex:1;border-top:1px solid var(--line)}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.it span{flex:1;min-width:0}
.it small{color:var(--mute);margin-left:6px}
.it label{font-size:13px;color:var(--mute);white-space:nowrap}
.del{border:0;background:none;color:#d6336c;font-weight:800;cursor:pointer;padding:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const LINES=['就是它了！{n}，我賭你會說「對，就是這個」。','{n}！別猶豫，猶豫就會餓。','今天的答案：{n}。不接受上訴。'];

let sel={},ref={},seen=new Set(),main=null,chal=null,rej=[];
function start(){seen.clear();sel={};ref={};rej=[];face('idle');pose('wave');
 ask(rand(GREET[meal])+'\n今天狀態如何？',MOODS.map(m=>[m.t,m]),m=>{sel.m=m;face('think');
  ask(m.r+'\n'+m.q,m.o,t=>{sel.t=t;
   ask((sel.txt?'「'+sel.txt+'」收到，我會優先考慮。':'收到。')+'最後一題：想吃哪一種主食？',[['飯類','rice'],['麵食、餃子','noodle'],['麵包、餅皮','bread'],['都可以','']],s=>{sel.staple=s;face('think');say('讓我想想……',()=>setTimeout(show,600))})},1)})}
function shake(){pose('up');say('來，幫我一起搖。搖三下，答案就出來。',()=>{ch.innerHTML='';let n=0;
 const T=['搖一搖 (0/3)','再用力點 (1/3)','最後一下！(2/3)'];
 const b=btn(T[0],()=>{n++;hop();face(n%2?'wow':'think');if(n>=3){b.disabled=true;setTimeout(show,450)}else b.textContent=T[n]},1);b.style.width='100%'})}
function score(f){let s=Math.random()*1.5;
 for(const c of [sel.m.g,sel.t,ref.taste]) if(c&&f.t.includes(c)) s+=3;
 if(sel.txt){const x=sel.txt;if(f.n.includes(x)||x.includes(f.n)||(f.c&&(f.c.includes(x)||x.includes(f.c))))s+=10;
  for(let i=0;i<x.length-1;i++){const g=x.slice(i,i+2);if(f.n.includes(g)||(f.c&&f.c.includes(g)))s+=4}
  for(const[k,v]of KW)if(x.includes(k)&&f.t.includes(v))s+=3}
 if(sel.m.nw&&!eaten(f.n)) s+=3;
 for(const k of [sel.staple,ref.staple,ref.main]) if(k&&RX[k].test(f.n)) s+=6;
 return s}
function pick(){const ok=f=>f.m.includes(meal);
 let pool=foods().filter(f=>ok(f)&&!seen.has(f.n)&&!(ref.avoid&&ref.avoid.has(f.c)));
 if(!pool.length){seen.clear();pool=foods().filter(ok)}
 if(!pool.length)return null;
 pool.sort((a,b)=>score(b)-score(a));return pool[0]}
function pickChal(){const c=foods().filter(f=>f.m.includes(meal)&&!eaten(f.n)&&f.n!==main.n);
 const d=c.filter(f=>f.c!==main.c);return rand(d.length?d:c.length?c:[null])}
function show(r){main=pick();
 if(!main){face('think');say('這個時段的清單是空的，到右上角「我的清單」新增一些吧。',()=>{ch.innerHTML='';btn('回到開頭',start,1)});return}
 seen.add(main.n);chal=pickChal();face('wow');pose('up');hop();
 say((r?'根據你剛剛說的，這次我很有把握：{n}。':rand(LINES)).replace('{n}',main.n),render)}
function card(lab,f,btns){const d=document.createElement('div');d.className='res';
 d.innerHTML='<div class="lab"></div><div class="nm"></div><span class="chip"></span><div class="row"></div>';
 d.children[0].textContent=lab;d.children[1].textContent=f.n;d.children[2].textContent=f.c||'自訂';
 btns.forEach(([t,fn,p])=>{const b=document.createElement('button');b.className='btn'+(p?' p':'');b.textContent=t;b.onclick=fn;d.children[3].appendChild(b)});
 ch.appendChild(d)}
function render(){ch.innerHTML='';face('happy');pose('point');
 card('今日推薦',main,[['就吃這個',()=>done(main),1],['再推一個',()=>reject()],['吃過了',()=>{mark(main.n);reject(1)}]]);
 if(chal)card('挑戰選項：你還沒吃過',chal,[['我要挑戰',()=>done(chal),1],['換一個挑戰',()=>{chal=pickChal();render()}]]);
 else{const p=document.createElement('p');p.style.cssText='margin:0 2px;color:#fff;font-weight:700;font-size:14px';p.textContent='清單裡的餐點你都吃過了，到「我的清單」新增新的來挑戰吧。';ch.appendChild(p)}}
function done(f){mark(f.n);rej=[];face('happy');pose('up');hop();say('好眼光！吃完記得回來跟我報告。',()=>{ch.innerHTML='';btn('再玩一次',start,1)})}
function reject(ate){rej.push(main);pose('down');
 if(rej.length>=3){refine();return}
 face('think');say(ate?'喔～老朋友了，那換一個。':'好，換一個，我不會生氣。',()=>setTimeout(show,400))}
function refine(){const cats=[...new Set(rej.map(f=>f.c))];rej=[];face('think');
 ask('連續三個都不對……是我猜錯方向了。來，問細一點。\n主角想吃什麼？',[['肉','meat'],['海鮮','sea'],['清爽蔬食','veg'],['都可以','']],b=>{ref.main=b;
 ask('口味偏哪邊？',[['清爽','l'],['暖胃','h'],['重口味','s'],['都可以','']],c=>{ref.taste=c;
 ask('剛剛推的都是「'+cats.join('、')+'」。要避開這幾類嗎？',[['要，避開','y'],['不用','n']],d=>{ref.avoid=d==='y'?new Set(cats):null;face('think');
  say('收到，這次我鎖定了。',()=>setTimeout(()=>show(1),500))})})})}

function renderList(){const L=$('#list');L.innerHTML='';
 foods().forEach(f=>{const r=document.createElement('div');r.className='it';
  const s=document.createElement('span');s.textContent=f.n;const sm=document.createElement('small');sm.textContent=f.c||'';s.appendChild(sm);
  const lb=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=eaten(f.n);
  cb.onchange=()=>{S.eaten=cb.checked?S.eaten.concat(f.n):S.eaten.filter(x=>x!==f.n);save()};
  lb.append(cb,' 吃過');
  const d=document.createElement('button');d.className='del';d.textContent='刪除';d.setAttribute('aria-label','刪除'+f.n);
  d.onclick=()=>{if(BASE.includes(f))S.removed.push(f.n);else S.custom=S.custom.filter(x=>x!==f);save();renderList()};
  r.append(s,lb,d);L.appendChild(r)})}
$('#addb').onclick=()=>{const n=$('#an').value.trim();if(!n)return;
 S.custom.push({n,m:$('#am').value,c:$('#ac').value.trim(),t:''});save();$('#an').value='';$('#ac').value='';renderList()};
$('#gear').onclick=()=>{renderList();$('#panel').classList.add('on')};
$('#close').onclick=()=>$('#panel').classList.remove('on');

const M=MEALS[meal];$('#ml').textContent=M[0]+'時間';
document.documentElement.style.setProperty('--g1',M[1]);document.documentElement.style.setProperty('--g2',M[2]);
start();
</script>
</body>
</html>
